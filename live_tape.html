<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nifty live tape v4</title>
  <style>
    :root {
      --bg: #0a0a0b; --panel: #11151c; --line: #2a3340; --text: #e8eaed;
      --muted: #8fa4b8; --up: #26a69a; --dn: #ef5350; --vwap: #ff9800; --silver: #c8ccd4;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.35 ui-sans-serif, system-ui, sans-serif; }
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 8px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 5;
    }
    header .right { display: flex; align-items: center; gap: 10px; }
    button#hard {
      background: #1a2230; color: var(--silver); border: 1px solid var(--line);
      border-radius: 6px; padding: 6px 10px; font-size: 11px; font-weight: 700; cursor: pointer;
    }
    button#hard:disabled { opacity: 0.5; cursor: wait; }
    .gexbar { margin: 0 12px 8px; padding: 8px 10px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line);
      display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); }
    h1 { margin: 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--silver); }
    #status { font-size: 11px; color: var(--muted); }
    #status.live { color: #00e676; }
    #status.dead { color: #ff5252; }
    .metrics { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; padding: 8px 12px; }
    .metric { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
    .metric .k { color: var(--muted); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }
    .metric .v { font-size: 16px; font-weight: 700; margin-top: 1px; }
    .va { margin: 0 12px 8px; padding: 8px 10px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); }
    .va .act { font-size: 15px; font-weight: 800; }
    .va .micro { color: var(--muted); margin-top: 3px; font-size: 11px; }
    .stack { margin: 0 12px 24px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px; }
    canvas { width: 100%; display: block; }
  </style>
</head>
<body>
  <header>
    <h1>Futures &amp; session flow</h1>
    <div class="right">
      <select id="idx" style="background:#1a2230;color:#c8ccd4;border:1px solid #2a3340;border-radius:6px;padding:5px 8px;font-size:12px;">
        <option>NIFTY</option>
        <option>BANKNIFTY</option>
        <option>FINNIFTY</option>
        <option>MIDCPNIFTY</option>
        <option>SENSEX</option>
        <option>GOLDM</option>
        <option>CRUDEOIL</option>
      </select>
      <button id="hard" type="button">Hard refresh GEX</button>
      <div id="status">connecting…</div>
    </div>
  </header>
  <div class="metrics">
    <div class="metric"><div class="k" id="m-spot-k">Spot</div><div class="v" id="m-spot">—</div></div>
    <div class="metric"><div class="k">Fut</div><div class="v" id="m-fut">—</div></div>
    <div class="metric"><div class="k">VWAP</div><div class="v" id="m-vwap">—</div></div>
    <div class="metric"><div class="k">EFI 13</div><div class="v" id="m-efi">—</div></div>
    <div class="metric"><div class="k">CVD</div><div class="v" id="m-cvd">—</div></div>
    <div class="metric"><div class="k">Bar</div><div class="v" id="m-bar">—</div></div>
  </div>
  <div class="gexbar" id="gexbar">GEX / VEX · hourly snapshot · not on ticks</div>
  <div class="va">
    <div class="act" id="va-act">NO ENTRY</div>
    <div class="micro" id="va-micro">Waiting…</div>
  </div>
  <div class="stack">
    <canvas id="c-all"></canvas>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const statusEl = $("status");
    const canvas = $("c-all");
    let state = { bars: [], va: {} };
    let hoverI = null;
    let geom = null;

    function fmt(n, d = 1) {
      if (n == null || Number.isNaN(+n)) return "—";
      return Number(n).toLocaleString("en-IN", { maximumFractionDigits: d, minimumFractionDigits: d });
    }

    function layout(ctx) {
      const dpr = devicePixelRatio || 1;
      const cssW = canvas.clientWidth || 900;
      const view = Math.max(560, window.innerHeight - 200);
      const hDv = 150, hEfi = 150, hCvd = 170;
      const pad = { l: 92, r: 96, t: 36, b: 22 };
      const hPx = view - pad.t - 8;
      const cssH = pad.t + hPx + hDv + hEfi + hCvd + 40;
      canvas.width = cssW * dpr;
      canvas.height = cssH * dpr;
      canvas.style.height = cssH + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return {
        w: cssW, h: cssH, pad,
        px: { y0: pad.t, y1: pad.t + hPx },
        dv: { y0: pad.t + hPx + 8, y1: pad.t + hPx + 8 + hDv },
        efi: { y0: pad.t + hPx + 16 + hDv, y1: pad.t + hPx + 16 + hDv + hEfi },
        cvd: { y0: pad.t + hPx + 24 + hDv + hEfi, y1: pad.t + hPx + 24 + hDv + hEfi + hCvd },
      };
    }

    function yMap(lo, hi, box) {
      const span = (hi - lo) || 1;
      return (v) => box.y1 - ((v - lo) / span) * (box.y1 - box.y0);
    }

    function draw() {
      const ctx = canvas.getContext("2d");
      const L = layout(ctx);
      ctx.clearRect(0, 0, L.w, L.h);
      const bars = state.bars || [];
      if (bars.length < 2) return;
      const n = bars.length;
      const left = L.pad.l, right = L.w - L.pad.r;
      const sessionSlots = Math.max(n, 126);
      const slot = (right - left) / sessionSlots;
      const xMid = (i) => left + (i + 0.5) * slot;
      geom = { left, right, slot, n };

      const highs = bars.map((b) => b.high);
      const lows = bars.map((b) => b.low);
      const vws = bars.map((b) => b.vwap).filter((v) => v != null);
      let lo = Math.min(...lows), hi = Math.max(...highs);
      const va = state.va || {};
      const lv0 = state.levels || {};
      const sessLo = lo, sessHi = hi, sessSpan = Math.max(hi - lo, 20);
      function near(v) {
        v = +v;
        return v && v >= sessLo - sessSpan * 0.12 && v <= sessHi + sessSpan * 0.12;
      }
      [va.vah, va.val, va.poc, va.pdh, va.pdl, state.vwap,
       va.vah80, va.val80, va.vah1, va.val1].forEach((v) => {
        if (near(v)) { lo = Math.min(lo, +v); hi = Math.max(hi, +v); }
      });
      (va.zones || []).forEach((z) => {
        [z.vah, z.val, z.poc].forEach((v) => {
          if (near(v)) { lo = Math.min(lo, +v); hi = Math.max(hi, +v); }
        });
      });
      const padPx = (hi - lo) * 0.06 || 8;
      lo -= padPx; hi += padPx;
      const yPx = yMap(lo, hi, L.px);

      // Volume profiles: left = signed ΔV, right = session volume
      (function drawProfiles() {
        const prof = va.profile || [];
        if (!prof.length) return;
        let maxVol = 1, maxAbsD = 1, pocPx = va.poc;
        prof.forEach((p) => {
          maxVol = Math.max(maxVol, p.vol || 0);
          maxAbsD = Math.max(maxAbsD, Math.abs(p.delta || 0));
          if (!pocPx || (p.vol || 0) > (prof.find((q) => q.px === pocPx)?.vol || 0)) {
            if (!va.poc) pocPx = p.px;
          }
        });
        const midL = L.pad.l * 0.50;
        const bh = Math.max(2, ((prof[1]?.px - prof[0]?.px) || 5) / (hi - lo) * (L.px.y1 - L.px.y0));
        prof.forEach((p) => {
          const y = yPx(p.px);
          if (y < L.px.y0 - 2 || y > L.px.y1 + 2) return;
          const dw = (Math.abs(p.delta || 0) / maxAbsD) * (L.pad.l - 18);
          ctx.fillStyle = (p.delta || 0) >= 0 ? "rgba(38,166,154,.8)" : "rgba(239,83,80,.8)";
          if ((p.delta || 0) >= 0) ctx.fillRect(midL, y - bh / 2, dw, bh);
          else ctx.fillRect(midL - dw, y - bh / 2, dw, bh);
          const vw = ((p.vol || 0) / maxVol) * (L.pad.r - 20);
          const isPoc = va.poc && Math.abs(p.px - va.poc) <= 3;
          ctx.fillStyle = isPoc ? "#ffd54f" : "rgba(100,181,246,.75)";
          ctx.fillRect(L.w - L.pad.r + 6, y - bh / 2, Math.max(vw, 0), bh);
        });
        ctx.strokeStyle = "rgba(255,255,255,.28)";
        ctx.beginPath(); ctx.moveTo(midL, L.px.y0); ctx.lineTo(midL, L.px.y1); ctx.stroke();
      })();

      // grid + levels
      ctx.lineWidth = 1;
      const levels = [
        [va.vah, "#64b5f6", "VAH"],
        [va.val, "#81c784", "VAL"],
        [va.poc, "#ffd54f", "POC"],
        [va.pdh, "#ff5252", "PDH"],
        [va.pdl, "#00e676", "PDL"],
        [(state.levels || {}).put_wall, "#00e676", "Put wall"],
        [(state.levels || {}).call_wall, "#ff5252", "Call wall"],
        [(state.levels || {}).flip, "#ffb300", "Flip"],
        [va.vah80, "#64b5f6", "VAH80"],
        [va.val80, "#81c784", "VAL80"],
        [va.vah1, "#90caf9", "VAH1σ"],
        [va.val1, "#a5d6a7", "VAL1σ"],
        [va.vah15, "#4fc3f7", "VAH1.5σ"],
        [va.val15, "#66bb6a", "VAL1.5σ"],
      ];
      (va.hvns || []).forEach((px, zi) => {
        if (Math.abs(px - (va.poc || 0)) < 4) return;
        levels.push([px, "#4fc3f7", "HVN"]);
      });
      levels.forEach(([v, col, name]) => {
        if (!v) return;
        if (v < lo - 2 || v > hi + 2) return;
        const y = yPx(v);
        ctx.strokeStyle = col;
        ctx.setLineDash([4, 4]);
        ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(right, y); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = col;
        ctx.font = "10px ui-sans-serif";
        ctx.fillText(`${name} ${Math.round(v)}`, right + 4, y + 3);
      });

      // VWAP
      ctx.strokeStyle = "#ff9800";
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      let started = false;
      bars.forEach((b, i) => {
        if (b.vwap == null) return;
        const x = xMid(i), y = yPx(b.vwap);
        if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
      });
      ctx.stroke();

      // candles
      bars.forEach((b, i) => {
        const up = b.close >= b.open;
        const x = xMid(i);
        const yH = yPx(b.high), yL = yPx(b.low), yO = yPx(b.open), yC = yPx(b.close);
        ctx.strokeStyle = up ? "#26a69a" : "#ef5350";
        ctx.fillStyle = up ? "#26a69a" : "#ef5350";
        ctx.beginPath(); ctx.moveTo(x, yH); ctx.lineTo(x, yL); ctx.stroke();
        const bw = Math.max(2, slot * 0.62);
        const top = Math.min(yO, yC), h = Math.max(1, Math.abs(yC - yO));
        ctx.fillRect(x - bw / 2, top, bw, h);
      });

      // Vertical labels 90° CCW, base sitting on that candle's high
      const labels = va.labels || [];
      labels.forEach((lab) => {
        const i = Math.min(n - 1, Math.max(0, Number.isFinite(+lab.i) ? +lab.i : n - 1));
        const text = String(lab.action || "").trim();
        if (!text || text === "NO ENTRY") return;
        const x = xMid(i);
        const t = lab.t || (bars[i] && bars[i].t) || "";
        const short = `${t} ${text}`.trim();
        const yHigh = yPx(bars[i].high);
        const col = /SHORT/.test(text) ? "#ef5350" : /LONG/.test(text) ? "#26a69a" : "#ffd54f";
        ctx.fillStyle = col;
        ctx.font = "bold 10px ui-sans-serif";
        ctx.save();
        ctx.translate(x + 3, yHigh - 4);
        ctx.rotate(-Math.PI / 2);
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        ctx.fillText(short, 0, 0);
        ctx.restore();
      });

      function paneBars(box, key, zeroLine = true) {
        const vals = bars.map((b) => +b[key] || 0);
        let mn = Math.min(...vals, 0), mx = Math.max(...vals, 0);
        if (mn === mx) { mx += 1; mn -= 1; }
        const y = yMap(mn, mx, box);
        if (zeroLine) {
          ctx.strokeStyle = "rgba(255,255,255,.35)";
          ctx.setLineDash([3, 3]);
          ctx.beginPath(); ctx.moveTo(left, y(0)); ctx.lineTo(right, y(0)); ctx.stroke();
          ctx.setLineDash([]);
        }
        const bw = Math.max(2, slot * 0.7);
        vals.forEach((v, i) => {
          ctx.fillStyle = v >= 0 ? "rgba(0,230,118,.75)" : "rgba(255,82,82,.75)";
          const y0 = y(0), y1 = y(v);
          ctx.fillRect(xMid(i) - bw / 2, Math.min(y0, y1), bw, Math.max(1, Math.abs(y1 - y0)));
        });
        ctx.fillStyle = "#8fa4b8";
        ctx.font = "10px ui-sans-serif";
        ctx.fillText(key === "delta" ? "ΔV" : key === "efi13" ? "EFI" : "CVD", 8, box.y0 + 12);
      }

      paneBars(L.dv, "delta");
      paneBars(L.efi, "efi13");

      // CVD as area + line
      const cv = bars.map((b) => +b.cvd || 0);
      let cLo = Math.min(...cv, 0), cHi = Math.max(...cv, 0);
      if (cLo === cHi) { cHi += 1; cLo -= 1; }
      const yC = yMap(cLo, cHi, L.cvd);
      ctx.strokeStyle = "rgba(255,255,255,.35)";
      ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(left, yC(0)); ctx.lineTo(right, yC(0)); ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath();
      bars.forEach((b, i) => {
        const x = xMid(i), y = yC(b.cvd || 0);
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      });
      ctx.strokeStyle = "#b0bec5";
      ctx.lineWidth = 1.4;
      ctx.stroke();
      ctx.fillStyle = "#8fa4b8";
      ctx.font = "10px ui-sans-serif";
      ctx.fillText("CVD", 8, L.cvd.y0 + 12);

      // time labels
      ctx.fillStyle = "#8fa4b8";
      ctx.font = "9px ui-sans-serif";
      const step = Math.max(1, Math.floor(n / 8));
      for (let i = 0; i < n; i += step) {
        ctx.fillText(bars[i].t || "", xMid(i) - 10, L.h - 4);
      }

      if (hoverI != null && bars[hoverI]) {
        const b = bars[hoverI];
        const x = xMid(hoverI);
        ctx.strokeStyle = "rgba(255,255,255,.35)";
        ctx.setLineDash([3, 3]);
        ctx.beginPath(); ctx.moveTo(x, L.px.y0); ctx.lineTo(x, L.cvd.y1); ctx.stroke();
        ctx.setLineDash([]);
        const lines = [
          `${b.t || ""} IST`,
          `O ${fmt(b.open)}  H ${fmt(b.high)}  L ${fmt(b.low)}  C ${fmt(b.close)}`,
          `VWAP ${fmt(b.vwap)}  ΔV ${fmt(b.delta, 0)}`,
          `EFI ${fmt(b.efi13, 0)}  CVD ${fmt(b.cvd, 0)}`,
        ];
        ctx.font = "12px ui-sans-serif";
        const tw = Math.max(...lines.map((s) => ctx.measureText(s).width)) + 16;
        const th = 18 * lines.length + 10;
        let bx = x + 12;
        if (bx + tw > L.w - 8) bx = x - tw - 12;
        let by = L.px.y0 + 8;
        ctx.fillStyle = "rgba(16,20,28,.94)";
        ctx.strokeStyle = "#00e676";
        ctx.lineWidth = 1;
        ctx.fillRect(bx, by, tw, th);
        ctx.strokeRect(bx, by, tw, th);
        ctx.fillStyle = "#e8eaed";
        lines.forEach((s, k) => ctx.fillText(s, bx + 8, by + 16 + k * 18));
      }
    }

    function render() {
      if (state.index && $("idx") && $("idx").value !== state.index) $("idx").value = state.index;
      if ($("m-spot-k")) $("m-spot-k").textContent = state.index || "Spot";
      $("m-spot").textContent = fmt(state.spot, 1);
      $("m-fut").textContent = fmt(state.fut, 1);
      $("m-vwap").textContent = fmt(state.vwap, 1);
      $("m-efi").textContent = fmt(state.efi, 0);
      $("m-cvd").textContent = fmt(state.cvd, 0);
      $("m-bar").textContent = state.bar_tf || "—";
      const act = (state.va && state.va.action) || "NO ENTRY";
      $("va-act").textContent = act;
      $("va-act").style.color = /SHORT/.test(act) ? "#ef5350" : /LONG/.test(act) ? "#26a69a" : "#ff9800";
      $("va-micro").textContent = (state.va && state.va.micro) || "";
      const g = state.gex || {};
      const net = g.net != null ? Number(g.net).toFixed(1) : "—";
      const vex = g.vex != null ? Number(g.vex).toFixed(1) : "—";
      $("gexbar").textContent =
        `GEX ${net} · VEX ${vex} · IV ${(g.atm_iv != null ? (g.atm_iv * 100).toFixed(1) : "—")}% · ` +
        `Put ${g.put_wall ?? "—"} · Call ${g.call_wall ?? "—"} · Flip ${g.flip ?? "—"} · ` +
        `as of ${g.ts || "pending"}` + (g.busy ? " · computing…" : " · auto 1h");
      draw();
    }

    function connect() {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      const ws = new WebSocket(`${proto}://${location.host}/ws`);
      ws.onopen = () => { statusEl.textContent = "live"; statusEl.className = "live"; };
      ws.onclose = () => {
        statusEl.textContent = "disconnected — retrying";
        statusEl.className = "dead";
        setTimeout(connect, 1500);
      };
      ws.onerror = () => ws.close();
      ws.onmessage = (ev) => {
        try { state = JSON.parse(ev.data); render(); } catch (e) {}
      };
    }
    connect();
    window.addEventListener("resize", render);
    canvas.addEventListener("mousemove", (ev) => {
      if (!geom) return;
      const rect = canvas.getBoundingClientRect();
      const x = ev.clientX - rect.left;
      const i = Math.floor((x - geom.left) / geom.slot);
      hoverI = (i >= 0 && i < geom.n) ? i : null;
      draw();
    });
    canvas.addEventListener("mouseleave", () => { hoverI = null; draw(); });
    $("idx").addEventListener("change", async () => {
      const name = $("idx").value;
      $("status").textContent = "switching " + name;
      try {
        await fetch("/api/index", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ index: name }),
        });
      } catch (e) {}
    });
    $("hard").addEventListener("click", async () => {
      $("hard").disabled = true;
      $("gexbar").textContent = "Queuing GEX refresh (ticks keep running)…";
      try {
        await fetch("/api/refresh-gex", { method: "POST" });
      } catch (e) {}
      setTimeout(() => { $("hard").disabled = false; }, 8000);
    });
  </script>
</body>
</html>
